name: Bug report
description: Report a reproducible simulator problem
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include private addresses, Makani numbers, or credentials.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the route, driving state, and what you expected.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: "1. Start …\n2. Select …\n3. Press …"
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser and operating system
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant console output
      render: shell
